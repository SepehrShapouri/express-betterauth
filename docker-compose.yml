services:
  postgres:
    image: postgres:16-alpine
    container_name: ctrl_server_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgresdata:/var/lib/postgresql/data
volumes:
  postgresdata:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
